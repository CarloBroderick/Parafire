<script>
"use strict";
const C = JSON.parse(document.getElementById('cfg').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phone = () => innerWidth <= 760;
if(C.embed) document.documentElement.classList.add('embed');

addEventListener('message', e => { if(e.data && (e.data.theme === 'light' || e.data.theme === 'dark')) document.documentElement.dataset.theme = e.data.theme; });
const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;

// ---------- panel text (spec text fields are trusted HTML written by the page author)
$('eyebrow').innerHTML = C.eyebrow || ''; $('title').innerHTML = C.title || '';
$('subtitle').innerHTML = C.subtitle || ''; if(!C.subtitle) $('subtitle').remove();
$('lede').innerHTML = C.lede || ''; if(!C.lede) $('lede').remove();
const both = (pl, te) => te ? '<div class="plain">' + (pl || '') + '</div><div class="tech">' + te + '</div>' : (pl || '');
if(C.how_to_read) $('howto').innerHTML = both(C.how_to_read, C.how_to_read_tech); else $('howtoWrap').remove();
// plain / technical: shown only when the spec has technical text; a host chart page can switch it too
const hasTech = !!(C.how_to_read_tech || (C.layers || []).some(L => L.description_tech || (L.tooltip || {}).text_tech));
function setLang(l){ document.documentElement.dataset.lang = l;
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l))); }
if(hasTech) document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
else $('langSec').remove();
addEventListener('message', e => { if(e.data && (e.data.lang === 'plain' || e.data.lang === 'tech')) setLang(e.data.lang); });
$('footer').innerHTML = C.footer || '';

(C.sources || []).forEach(s => { const li = document.createElement('li'); li.innerHTML = s; $('sources').appendChild(li); });
if(C.embed || (!(C.sources || []).length && !C.footer && !C.brand)) $('srcsSec').remove();
const panel = $('panel');
function setPanel(open){ panel.classList.toggle('closed', !open); document.body.classList.toggle('pclosed', !open); $('panelToggle').setAttribute('aria-expanded', String(open)); syncPh(); }
function syncPh(){ document.documentElement.style.setProperty('--ph', phone() ? panel.offsetHeight + 'px' : '0px'); }
$('panelToggle').addEventListener('click', () => setPanel(panel.classList.contains('closed')));
setPanel(!phone());
new ResizeObserver(syncPh).observe(panel);

// ---------- formatting for hover cards
function fmt(v, f){
  if(v === null || v === undefined || v === '') return null;
  if(f.labels && f.labels[String(v)] !== undefined) v = f.labels[String(v)];
  const n = Number(v), fm = f.format || 'text';
  let s;
  if(fm === 'int' && isFinite(n)) s = Math.round(n).toLocaleString('en-US');
  else if(/^num[0-9]$/.test(fm) && isFinite(n)) s = n.toLocaleString('en-US', {minimumFractionDigits:+fm[3], maximumFractionDigits:+fm[3]});
  else if(fm === 'pct' && isFinite(n)) s = (n * 100).toLocaleString('en-US', {maximumFractionDigits:f.decimals ?? 0}) + '%';
  else if(fm === 'pct100' && isFinite(n)) s = n.toLocaleString('en-US', {maximumFractionDigits:f.decimals ?? 0}) + '%';
  else s = String(v);
  return (f.prefix || '') + s + (f.suffix || '');
}
function catOf(L, p){ const cb = L.color_by; if(!cb || cb.type !== 'categorical') return null;
  const v = String(p[cb.field]); return cb.categories.find(c => String(c.value) === v) || null; }
function card(L, p){

  const c = catOf(L, p);

  const sw = c ? '<span class="sw" style="background:' + c.color + '"></span>' : '';
  let h = '<div class="card"><div class="ct">' + sw + esc(title) + '</div>';
  if(t.text) h += '<p>' + both(t.text, t.text_tech) + '</p>';
  const rows = (t.fields || []).map(f => [f.label, fmt(p[f.field], f)]).filter(r => r[1] !== null);
  if(rows.length) h += '<dl>' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
  return h + '</div>';
}

// ---------- style expressions
function colorExpr(L){
  const cb = L.color_by, st = L.style || {};
  if(!cb) return st.color || '#3B82F6';
  if(cb.type === 'categorical'){
    const e = ['match', ['to-string', ['get', cb.field]]];
    cb.categories.forEach(c => e.push(String(c.value), c.color)); e.push(cb.other_color || '#9AA3AD'); return e;
  }
  const e = ['interpolate', ['linear'], ['to-number', ['get', cb.field]]]; cb.stops.forEach(s => e.push(s[0], s[1]));
  return ['case', ['==', ['get', cb.field], null], cb.nodata_color || '#9AA3AD', e];
}
function edgeExpr(L){
  const cb = L.color_by, st = L.style || {};
  if(cb && cb.type === 'categorical' && cb.categories.some(c => c.edge)){
    const e = ['match', ['to-string', ['get', cb.field]]];
    cb.categories.forEach(c => e.push(String(c.value), c.edge || st.outline || '#FFFFFF')); e.push(st.outline || '#FFFFFF'); return e;
  }
  return st.outline || (L.kind === 'polygon' ? colorExpr(L) : '#FFFFFF');
}
const hov = (a, b) => ['case', ['boolean', ['feature-state', 'hover'], false], a, b];

// ---------- map
const basePad = () => phone() ? {top:24, right:24, left:24, bottom:panel.offsetHeight + 24}
                              : {top:40, right:40, bottom:40, left:panel.classList.contains('closed') ? 40 : (C.embed ? 330 : 400)};
let map = null;
// The map is created only once its final style is known, and overlays go on at 'style.load'. (Adding them on
// the first 'styledata' event raced the style load and sometimes left the map without overlays.)
function start(style){
  map = new maplibregl.Map({container:'map', style:style,
    bounds:[[C.bounds[0], C.bounds[1]], [C.bounds[2], C.bounds[3]]], fitBoundsOptions:{padding:basePad()},
    maxZoom:20, dragRotate:false, pitchWithRotate:false, attributionControl:false, hash:C.hash === false ? false : 'view',
    cooperativeGestures:!!C.embed});           // embedded: two fingers / Ctrl+scroll move the map, so the page still scrolls
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
  if(C.embed) map.addControl(new maplibregl.FullscreenControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl({unit:'imperial', maxWidth:110}), 'bottom-left');
  map.addControl(new maplibregl.ScaleControl({unit:'metric', maxWidth:110}), 'bottom-left');
  map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');
  map.once('style.load', addOverlays);
  map.once('load', () => {
    addOverlays();                                   // no-op if 'style.load' already added them
    if(!location.hash.includes('view=')) fly(C.bounds, false);
    document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(e => {      // start the credits folded
      e.classList.remove('maplibregl-compact-show'); e.removeAttribute('open'); });
  });
}

const NAIP_URL = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=jpg&f=image';
const ESRI_URL = 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const ESRI_ATTR = 'Imagery: Esri, Maxar, Earthstar Geographics, and the GIS User Community';
const NAIP_ATTR = 'Aerial photo: USDA NAIP via USGS The National Map (public domain)';
const BM = {
  satellite:{label:'Satellite', note:'Esri World Imagery. Image dates vary by place and can be before or after an event; check before reading damage from the photo.'},
  aerial:{label:'Aerial (NAIP)', note:'USDA NAIP aerial photography via USGS The National Map: the most recent flight here, which can be after an event.'},
  map:{label:'Map', note:'Street map: OpenStreetMap data via OpenFreeMap.'},
  hybrid:{label:'Hybrid', note:'Esri World Imagery with street and place labels from OpenStreetMap.'}
};
Object.entries(C.basemap_notes || {}).forEach(([k, v]) => { if(BM[k]) BM[k].note = v; });
const modes = (C.basemaps || ['satellite','aerial','map','hybrid']).filter(m => BM[m]);
let mode = modes.includes(C.basemap) ? C.basemap : modes[0];
let vecLayers = [], symLayers = [];
modes.forEach(m => { const b = document.createElement('button'); b.type = 'button'; b.dataset.m = m; b.textContent = BM[m].label;
  b.addEventListener('click', () => setBase(m)); $('bm').appendChild(b); });
function vis(id, on){ if(map && map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
function setBase(m){
  mode = m; vis('bm-esri', m === 'satellite' || m === 'hybrid'); vis('bm-naip', m === 'aerial');
  vecLayers.forEach(id => vis(id, m === 'map' || (m === 'hybrid' && symLayers.includes(id))));
  document.querySelectorAll('#bm button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  $('bmNote').textContent = BM[m].note;
}
const rasterBase = {
  sources:{ 'bm-esri':{type:'raster', tiles:[ESRI_URL], tileSize:256, maxzoom:19, attribution:ESRI_ATTR},
            'bm-naip':{type:'raster', tiles:[NAIP_URL], tileSize:256, maxzoom:20, attribution:NAIP_ATTR} },
  layers:[ {id:'bm-esri', type:'raster', source:'bm-esri', layout:{visibility:'none'}},
           {id:'bm-naip', type:'raster', source:'bm-naip', layout:{visibility:'none'}} ]
};
// the street-map style is optional: if it has not arrived in 6 s, start with imagery only rather than a blank page
const styleCtl = new AbortController(); setTimeout(() => styleCtl.abort(), 6000);
fetch('https://tiles.openfreemap.org/styles/' + (C.vector_style || 'liberty'), {signal:styleCtl.signal}).then(r => r.json()).then(st => {
  st.layers.forEach(l => { l.layout = l.layout || {}; });
  vecLayers = st.layers.filter(l => l.type !== 'background').map(l => l.id);
  symLayers = st.layers.filter(l => l.type === 'symbol').map(l => l.id);
  Object.assign(st.sources, rasterBase.sources);
  st.layers.splice(1, 0, ...rasterBase.layers);
  start(st);
}).catch(() => {
  modes.splice(0, modes.length, ...modes.filter(m => m === 'satellite' || m === 'aerial'));
  document.querySelectorAll('#bm button').forEach(b => { if(!modes.includes(b.dataset.m)) b.remove(); });
  if(!modes.includes(mode)) mode = 'satellite';
  start({version:8, sources:rasterBase.sources, layers:rasterBase.layers});
});

// ---------- overlays
const hidden = {};         // layer id -> Set of hidden category values
const sub = {};            // layer id -> map layer ids drawn for it
const hitLayers = [];      // map layer ids that answer hover/tap, top-most first
function dataFor(L){ if(L.url) return L.url; const el = $('d-' + L.id); return el ? JSON.parse(el.textContent) : {type:'FeatureCollection', features:[]}; }
function addOverlays(){
  if(map.getSource('ov-' + (C.layers[0] || {}).id)) return;
  C.layers.forEach(L => {
    const src = 'ov-' + L.id, st = L.style || {}, ids = [], v = L.visible === false ? 'none' : 'visible';
    const zoom = o => { if(L.minzoom != null) o.minzoom = L.minzoom; if(L.maxzoom != null) o.maxzoom = L.maxzoom; return o; };
    if(L.kind === 'raster'){
      map.addSource(src, {type:'image', url:L.image.src, coordinates:L.image.coordinates});
      map.addLayer(zoom({id:L.id + '-img', type:'raster', source:src, layout:{visibility:v},
        paint:{'raster-opacity':L.opacity ?? .75, 'raster-resampling':L.resampling || 'nearest', 'raster-fade-duration':0}})); ids.push(L.id + '-img');
    } else {
      map.addSource(src, {type:'geojson', data:dataFor(L), generateId:true});
      if(L.kind === 'line'){
        const w = st.width ?? 2;
        if(st.halo !== false) { map.addLayer(zoom({id:L.id + '-halo', type:'line', source:src, layout:{visibility:v, 'line-join':'round'},
          paint:{'line-color':st.halo_color || '#0B1218', 'line-width':w + 2.6, 'line-opacity':.45}})); ids.push(L.id + '-halo'); }
        const p = {'line-color':colorExpr(L), 'line-width':hov(w + 1.5, w), 'line-opacity':st.opacity ?? 1};
        if(st.dash) p['line-dasharray'] = st.dash;
        map.addLayer(zoom({id:L.id + '-line', type:'line', source:src, layout:{visibility:v, 'line-join':'round'}, paint:p})); ids.push(L.id + '-line');
        map.addLayer(zoom({id:L.id + '-hit', type:'line', source:src, layout:{visibility:v}, paint:{'line-color':'#000', 'line-width':14, 'line-opacity':0.001}}));
        ids.push(L.id + '-hit'); if(L.tooltip) hitLayers.unshift(L.id + '-hit');
      } else if(L.kind === 'polygon'){
        map.addLayer(zoom({id:L.id + '-fill', type:'fill', source:src, layout:{visibility:v},
          paint:{'fill-color':colorExpr(L), 'fill-opacity':hov(Math.min(1, (st.fill_opacity ?? .55) + .2), st.fill_opacity ?? .55)}}));
        map.addLayer(zoom({id:L.id + '-line', type:'line', source:src, layout:{visibility:v},
          paint:{'line-color':edgeExpr(L), 'line-width':hov((st.outline_width ?? 1) + 1.6, st.outline_width ?? 1), 'line-opacity':.95}}));
        ids.push(L.id + '-fill', L.id + '-line'); if(L.tooltip) hitLayers.unshift(L.id + '-fill');
      } else {
        const r = st.radius || [[8, 2.5], [12, 4], [16, 7]], rad = ['interpolate', ['linear'], ['zoom']];
        r.forEach(s => rad.push(s[0], s[1]));
        const lay = {visibility:v}, cb = L.color_by;
        if(cb && cb.type === 'categorical'){            // the first class in the key draws on top
          const k = ['match', ['to-string', ['get', cb.field]]], n = cb.categories.length;
          cb.categories.forEach((c, i) => k.push(String(c.value), n - i)); k.push(0); lay['circle-sort-key'] = k; }
        map.addLayer(zoom({id:L.id + '-pt', type:'circle', source:src, layout:lay, paint:{
          'circle-radius':rad, 'circle-color':colorExpr(L), 'circle-opacity':st.opacity ?? .95,
          'circle-stroke-color':edgeExpr(L), 'circle-stroke-width':hov(2.6, st.outline_width ?? .7)}}));
        ids.push(L.id + '-pt'); if(L.tooltip) hitLayers.unshift(L.id + '-pt');
      }
    }
    sub[L.id] = ids; hidden[L.id] = new Set();
  });
  setBase(mode); buildKey(); wire();
}

// ---------- key = layer control (visibility + category filters + counts)
function swatch(L, color){
  const s = document.createElement('span');
  s.className = 'sw' + (L.kind === 'polygon' || L.kind === 'raster' ? ' sq' : L.kind === 'line' ? ' ln' : '');
  if(L.kind === 'line') s.style.borderTopColor = color, s.style.borderTopStyle = (L.style || {}).dash ? 'dashed' : 'solid';
  else s.style.background = color;
  return s;
}
function applyFilter(L){
  const cb = L.color_by, h = hidden[L.id];
  const f = cb && h.size ? ['!', ['in', ['to-string', ['get', cb.field]], ['literal', [...h]]]] : null;
  sub[L.id].forEach(id => { if(map.getLayer(id) && L.kind !== 'raster') map.setFilter(id, f); });
}
function buildKey(){
  const box = $('layers');
  C.layers.forEach(L => {
    if(L.in_key === false) return;
    const d = document.createElement('div'); d.className = 'lay';
    const row = document.createElement('label'); row.className = 'lrow';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = L.visible !== false;
    cb.addEventListener('change', () => sub[L.id].forEach(id => vis(id, cb.checked)));
    row.appendChild(cb);
    const cbx = L.color_by;
    if(!cbx) row.appendChild(swatch(L, (L.style || {}).color || '#3B82F6'));
    const nm = document.createElement('span'); nm.textContent = L.name; row.appendChild(nm);
    if(L.count != null){ const c = document.createElement('span'); c.className = 'cnt'; c.textContent = L.count.toLocaleString('en-US'); row.appendChild(c); }
    d.appendChild(row);
    if(L.description){ const p = document.createElement('p'); p.className = 'ldesc'; p.innerHTML = both(L.description, L.description_tech); d.appendChild(p); }
    if(cbx && cbx.type === 'categorical'){
      const ul = document.createElement('ul'); ul.className = 'cats';
      cbx.categories.forEach(c => {
        const li = document.createElement('li'), lab = document.createElement('label'), x = document.createElement('input');
        x.type = 'checkbox'; x.checked = true;
        x.addEventListener('change', () => { x.checked ? hidden[L.id].delete(String(c.value)) : hidden[L.id].add(String(c.value)); applyFilter(L); });
        lab.append(x, swatch(L, c.color));
        const t = document.createElement('span'); t.textContent = c.label; lab.appendChild(t);
        if(c.count != null){ const n = document.createElement('span'); n.className = 'cnt'; n.textContent = c.count.toLocaleString('en-US'); lab.appendChild(n); }
        li.appendChild(lab); ul.appendChild(li);
      });
      d.appendChild(ul);
    } else if(cbx && cbx.type === 'continuous'){
      const g = document.createElement('div'); g.className = 'grad';
      const lo = cbx.stops[0][0], hi = cbx.stops[cbx.stops.length - 1][0];
      g.style.background = 'linear-gradient(90deg,' + cbx.stops.map(s => s[1] + ' ' + ((s[0] - lo) / (hi - lo) * 100).toFixed(1) + '%').join(',') + ')';
      const gl = document.createElement('div'); gl.className = 'gl';
      gl.innerHTML = '<span>' + esc(cbx.min_label ?? lo) + '</span><span>' + esc(cbx.max_label ?? hi) + '</span>';
      d.append(g, gl);
      if(cbx.label){ const t = document.createElement('div'); t.className = 'gt'; t.textContent = cbx.label; d.appendChild(t); }
    }
    box.appendChild(d);
  });
}

// ---------- places to look (tabs)
const sites = [{name:C.whole_label || 'Whole area', bounds:C.bounds, note:''}].concat(C.sites || []);
function fly(b, anim){ if(map) map.fitBounds([[b[0], b[1]], [b[2], b[3]]], {padding:basePad(), maxZoom:C.max_fit_zoom || 17, duration:anim ? 900 : 0}); }
if(!C.sites || !C.sites.length) $('sitesSec').remove();
else sites.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = s.name;
  b.setAttribute('aria-selected', String(i === 0));
  b.addEventListener('click', () => { document.querySelectorAll('#sites button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    $('siteNote').innerHTML = s.note || ''; fly(s.bounds, true); if(phone()) setPanel(false); });
  $('sites').appendChild(b);
});

// ---------- hover (desktop) and tap (phone)
const pop = new maplibregl.Popup({closeButton:false, closeOnClick:false, maxWidth:'320px', offset:12});
let hovered = null;
const layerOf = id => C.layers.find(L => sub[L.id] && sub[L.id].includes(id));
function pick(e){
  const ids = hitLayers.filter(id => map.getLayer(id) && map.getLayoutProperty(id, 'visibility') !== 'none');
  if(!ids.length) return null;
  const fs = map.queryRenderedFeatures(e.point, {layers:ids});
  return fs.length ? fs[0] : null;
}
function setHover(f){
  if(hovered) map.setFeatureState(hovered, {hover:false}); hovered = null;
  if(f && f.id !== undefined){ hovered = {source:f.source, id:f.id}; map.setFeatureState(hovered, {hover:true}); }
}
function wire(){
  map.on('mousemove', e => { if(!canHover) return; const f = pick(e);
    map.getCanvas().style.cursor = f ? 'pointer' : '';
    if(!f){ pop.remove(); setHover(null); return; }
    setHover(f); pop.setLngLat(e.lngLat).setHTML(card(layerOf(f.layer.id), f.properties)).addTo(map); });
  map.on('mouseout', () => { pop.remove(); setHover(null); });
  map.on('click', e => { const f = pick(e);
    if(canHover){ if(f){ pop.remove(); new maplibregl.Popup({maxWidth:'320px', offset:12}).setLngLat(e.lngLat).setHTML(card(layerOf(f.layer.id), f.properties)).addTo(map); } return; }
    if(!f){ closeSheet(); return; }
    setHover(f); $('sheetBody').innerHTML = card(layerOf(f.layer.id), f.properties); $('sheet').style.display = 'block'; });
}
function closeSheet(){ $('sheet').style.display = 'none'; setHover(null); }
$('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheet(); pop.remove(); } });
</script>
</body></html>
